name: Build and package the E2631 A1/A2/A3 U-Boot (RAM chain)
on:
  workflow_dispatch:
    inputs:
      checkpatch:
        description: 'Run scripts/checkpatch.pl on the port patches; exactly four reviewed warning classes are ignored and any other warning or error fails the build'
        type: boolean
        default: true
run-name: E2631 A1/A2/A3 U-Boot - ${{ github.ref_name }} - run ${{ github.run_number }}
permissions:
  contents: read
concurrency:
  group: e2631-uboot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    # task-44/task-50/task-51: custom U-Boot A1/A2/A3 (RAM chain) cross-build.
    # This workflow is standalone: it does not touch the firmware.yml/check.yml
    # main chain and it has no publish step.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Load the U-Boot pins from uboot-port/commits.env
        # Pin values live in uboot-port/commits.env (task-43); this workflow keeps
        # no second copy of them. Every value is validated before use.
        run: |
          set -euo pipefail
          set -a
          . uboot-port/commits.env
          set +a
          for name in \
            E2631_UBOOT_REPO \
            E2631_UBOOT_BRANCH \
            E2631_UBOOT_SHA \
            E2631_UBOOT_BASE_TREE_SHA \
            E2631_UBOOT_TREE_SHA \
            E2631_UBOOT_PAYLOAD_MAX \
            E2631_UBOOT_TEXT_BASE \
            E2631_UBOOT_SOURCE_DATE_EPOCH; do
            value=${!name:-}
            if [ -z "$value" ]; then
              echo "::error::uboot-port/commits.env does not define $name"
              exit 1
            fi
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done
          # The patch series is pin-driven: every NNNN-*.patch needs a matching
          # E2631_UBOOT_PATCH_SHA256_NNNN pin, and the pin count must match the
          # file count. No series length is hardcoded here.
          patches=("$GITHUB_WORKSPACE"/uboot-port/patches/[0-9][0-9][0-9][0-9]-*.patch)
          if [ ! -e "${patches[0]}" ]; then
            echo "::error::no uboot-port/patches/NNNN-*.patch files"
            exit 1
          fi
          for patch in "${patches[@]}"; do
            n=$(basename "$patch" | cut -c1-4)
            name="E2631_UBOOT_PATCH_SHA256_$n"
            value=${!name:-}
            if [ -z "$value" ]; then
              echo "::error::$name is not pinned in uboot-port/commits.env"
              exit 1
            fi
            printf "%s=%s\n" "$name" "$value" >> "$GITHUB_ENV"
          done
          pinned=$(env | grep -c "^E2631_UBOOT_PATCH_SHA256_[0-9][0-9][0-9][0-9]=" || true)
          if [ "$pinned" != "${#patches[@]}" ]; then
            echo "::error::$pinned patch pins in commits.env but ${#patches[@]} patch files"
            exit 1
          fi
          printf "E2631_UBOOT_PATCH_COUNT=%s\n" "${#patches[@]}" >> "$GITHUB_ENV"
          printf 'UBOOT_DIR=%s\n' "$RUNNER_TEMP/u-boot" >> "$GITHUB_ENV"
          # Reproducible banner (task-69 item d): U-Boot embeds U_BOOT_DATE/
          # U_BOOT_TIME from SOURCE_DATE_EPOCH when it is set (Makefile:2327-2351),
          # so export the frozen pin here instead of letting the CI clock leak in.
          printf 'SOURCE_DATE_EPOCH=%s\n' "$E2631_UBOOT_SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          echo "pins: $E2631_UBOOT_REPO $E2631_UBOOT_BRANCH @ $E2631_UBOOT_SHA"
      - name: Install the ARM cross toolchain and U-Boot build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison flex device-tree-compiler bc \
            python3 python3-dev python3-setuptools python3-pyelftools \
            swig libssl-dev gcc-arm-none-eabi binutils-arm-none-eabi
          arm-none-eabi-gcc --version | head -1
      - name: Fetch the pinned u-boot baseline and check its tree
        run: |
          set -euo pipefail
          mkdir -p "$UBOOT_DIR"
          cd "$UBOOT_DIR"
          git init -q .
          git remote add origin "$E2631_UBOOT_REPO"
          git fetch -q --depth 1 origin "$E2631_UBOOT_SHA"
          git -c advice.detachedHead=false checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$E2631_UBOOT_SHA" || {
            echo "::error::fetched commit is not the pinned u-boot commit"
            exit 1
          }
          base_tree=$(git rev-parse 'HEAD^{tree}')
          if [ "$base_tree" != "$E2631_UBOOT_BASE_TREE_SHA" ]; then
            echo "::error::baseline tree $base_tree != $E2631_UBOOT_BASE_TREE_SHA"
            exit 1
          fi
          echo "baseline: $E2631_UBOOT_SHA tree $base_tree"
      - name: Verify and apply the pinned port patches
        # Triple pin: commit -> patch sha256 -> post-am tree. A patch or baseline
        # change must update uboot-port/commits.env and be re-reviewed.
        run: |
          set -euo pipefail
          cd "$UBOOT_DIR"
          for patch in "$GITHUB_WORKSPACE"/uboot-port/patches/[0-9][0-9][0-9][0-9]-*.patch; do
            n=$(basename "$patch" | cut -c1-4)
            name="E2631_UBOOT_PATCH_SHA256_$n"
            expected=${!name}
            echo "$expected  $patch" | sha256sum -c -
          done
          # Reproducible version token (task-69 item d): the replayed commits keep
          # their patch author date and get it as committer date too, so the am
          # commit SHAs (and the git-describe token in the banner) depend only on
          # the pins.  Without this flag HEAD changes on every build and so does
          # u-boot.bin, even for an identical tree.
          git -c user.name='E2631 CI' -c user.email='ci@localhost' am \
            --committer-date-is-author-date \
            "$GITHUB_WORKSPACE"/uboot-port/patches/*.patch
          tree=$(git rev-parse 'HEAD^{tree}')
          if [ "$tree" != "$E2631_UBOOT_TREE_SHA" ]; then
            echo "::error::post-am tree $tree != $E2631_UBOOT_TREE_SHA"
            exit 1
          fi
          commits=$(git rev-list --count "$E2631_UBOOT_SHA..HEAD")
          if [ "$commits" != "$E2631_UBOOT_PATCH_COUNT" ]; then
            echo "::error::expected $E2631_UBOOT_PATCH_COUNT port commits, found $commits"
            exit 1
          fi
          echo "post-am: $commits commits, tree $tree"
      - name: Embed the failsafe rescue page
        # E4 v1 (task-73): the rescue page is a single self-contained HTML file
        # (no CDN, no i18n). The embed step runs after "git am" and before
        # "make" because patch 0026 adds e2631_failsafe_asset.o to the board
        # Makefile: a build without generation fails at compile time. The C
        # file is deterministic (gzip -9 -n, no timestamps), the generated
        # files are not committed, and the step fails when the gzip asset is
        # above the 6144-byte E4 v1 budget. E2631-FAILSAFE-ASSET.txt records
        # the raw/gzip sizes and the gzip sha256 in the artifact.
        run: |
          set -euo pipefail
          bash tools/embed-failsafe.sh \
            --outdir "$UBOOT_DIR/board/zte/zxhn-e2631" \
            --stats "$UBOOT_DIR/artifacts/E2631-FAILSAFE-ASSET.txt"
          test -s "$UBOOT_DIR/board/zte/zxhn-e2631/e2631_failsafe_asset.c"
          test -s "$UBOOT_DIR/artifacts/E2631-FAILSAFE-ASSET.txt"
      - name: Configure and build with the ARM cross toolchain
        run: |
          set -euo pipefail
          cd "$UBOOT_DIR"
          make O=build zx279128s_zte_zxhn-e2631_defconfig
          make O=build -j"$(nproc)" CROSS_COMPILE=arm-none-eabi- 2>&1 | tee build/build.log
      - name: Enforce the A1/A2/A3 acceptance gates
        # Acceptance gates from uboot-port/README.md section 4: config symbols,
        # payload size (mtd0 0x9F800 budget for the flash-writing stage) and entry
        # point (secondboot blx 0x47F00000 in the product chain; vendor U-Boot
        # tftp 0x47F00000 + go 0x47F00000 in the RAM chain).
        run: |
          set -euo pipefail
          cd "$UBOOT_DIR"
          test -f build/u-boot.bin || {
            echo "::error::build/u-boot.bin was not produced"
            exit 1
          }
          for symbol in \
            CONFIG_ARCH_ZX279128=y \
            CONFIG_TARGET_ZXHN_E2631=y \
            CONFIG_TEXT_BASE=0x47F00000 \
            CONFIG_OF_EMBED=y \
            CONFIG_ARM_GLOBAL_TIMER=y \
            CONFIG_TIMER=y \
            CONFIG_PL01X_SERIAL=y \
            CONFIG_DM_SERIAL=y \
            CONFIG_CLK=y \
            CONFIG_SPI=y \
            CONFIG_DM_SPI=y \
            CONFIG_SPI_ZX=y \
            CONFIG_MTD=y \
            CONFIG_DM_MTD=y \
            CONFIG_MTD_SPI_NAND=y \
            CONFIG_CMD_MTD=y \
            CONFIG_BOARD_LATE_INIT=y \
            CONFIG_SUPPORT_PASSING_ATAGS=y \
            CONFIG_SETUP_MEMORY_TAGS=y \
            'CONFIG_BOOTCOMMAND="e2631boot"' \
            CONFIG_ENV_IS_IN_MTD=y \
            'CONFIG_ENV_MTD_DEV="spi-nand0"' \
            CONFIG_ENV_OFFSET=0xc0000 \
            CONFIG_ENV_SIZE=0x20000 \
            CONFIG_DM_ETH=y \
            CONFIG_DM_MDIO=y \
            CONFIG_PHYLIB=y \
            CONFIG_PHY_GIGE=y \
            CONFIG_ETH_ZX279128S=y \
            CONFIG_MDIO_ZX279128S=y \
            CONFIG_NET_RANDOM_ETHADDR=y \
            CONFIG_CMD_DHCP=y \
            CONFIG_CMD_MII=y \
            CONFIG_CMD_PING=y \
            CONFIG_CMD_TFTPBOOT=y \
            CONFIG_MTK_TCP=y \
            CONFIG_MTK_DHCPD=y \
            CONFIG_SHA256=y \
            '# CONFIG_MTK_TCP_VERBOSE is not set' \
            '# CONFIG_SKIP_LOWLEVEL_INIT is not set'; do
            grep -qx "$symbol" build/.config || {
              echo "::error::build/.config is missing $symbol"
              exit 1
            }
          done
          if ! grep -aq 'zte,zx29-uart' build/u-boot.bin; then
            echo "::error::the embedded DTB does not use the ZTE UART compatible"
            exit 1
          fi
          # A2: the SPI controller and the SPI-NAND child must be in the
          # embedded DTB, otherwise the build passes while mtd would find no
          # flash at runtime.
          for dtb_string in zte,zx279128s-spifc spi-nand zte,zx279128s-gmac \
                           zte,zx279128s-mdio ethernet-phy; do
            if ! grep -aq "$dtb_string" build/u-boot.bin; then
              echo "::error::the embedded DTB is missing $dtb_string"
              exit 1
            fi
          done
          # A3: the slot boot command and the env device name must be linked
          # into the image, and saveenv must be compiled out (read-only stage).
          for binary_string in e2631boot e2631soc e2631refclk e2631flash e2631verify e2631slot e2631env e2631net e2631rescue spi-nand0; do
            if ! grep -aq "$binary_string" build/u-boot.bin; then
              echo "::error::u-boot.bin is missing $binary_string"
              exit 1
            fi
          done
          # D-U1: the defconfig must keep the raw mtd write/erase subcommands
          # compiled out, and the three new commands must carry their help text.
          grep -qx '# CONFIG_CMD_MTD_WRITE is not set' configs/zx279128s_zte_zxhn-e2631_defconfig
          for usage_string in 'flash an image to SPI-NAND with erase, blank and readback checks' 'compare a RAM image with a SPI-NAND range by CRC32 (read-only)' 'print the firmware slot table'; do
            if ! grep -aq "$usage_string" build/u-boot.bin; then
              echo "::error::u-boot.bin is missing the help text: $usage_string"
              exit 1
            fi
          done
          # E4 v1 (task-72): the rescue command, its digest/confirm contract and
          # the shared five-step writer must survive the diet and the link; the
          # rescue code must not grow a second MTD write path (D-U1 allowlist).
          for rescue_string in 'serve the web bootloader rescue on lan1' 'X-E2631-SHA256' 'X-E2631-Confirm: write' 'e2631rescue: PASS: mtd0 updated'; do
            if ! grep -aq "$rescue_string" build/u-boot.bin; then
              echo "::error::u-boot.bin is missing the rescue text: $rescue_string"
              exit 1
            fi
          done
          for rescue_marker in e2631_flash_begin sha256_csum_wd e2631_failsafe_html_gz; do
            if ! grep -q "$rescue_marker" board/zte/zxhn-e2631/e2631rescue.c; then
              echo "::error::e2631rescue.c is missing $rescue_marker"
              exit 1
            fi
          done
          if grep -Eq 'mtd_write|mtd_erase|mtd_special_write_oob' board/zte/zxhn-e2631/e2631rescue.c; then
            echo "::error::e2631rescue.c must not call the MTD writers directly (D-U1)"
            exit 1
          fi
          echo "E4 rescue gates: command, digest contract and shared writer present"
          # E4 v1 window regression (task-78): the rescue write must program the
          # whole U-Boot area 0x20000..0xC0000 from the image base, and the
          # erase/write/compare windows must be the same one.
          rescue_c=board/zte/zxhn-e2631/e2631rescue.c
          grep -qE '^#define E2631_RESCUE_FLASH_OFF[[:space:]]+0x20000UL' "$rescue_c"
          grep -qE '^#define E2631_RESCUE_FLASH_LEN[[:space:]]+0xA0000UL' "$rescue_c"
          grep -qE '^#define E2631_RESCUE_MTD0_END[[:space:]]+0xC0000UL' "$rescue_c"
          grep -q 'static_assert(E2631_RESCUE_FLASH_OFF + E2631_RESCUE_FLASH_LEN ==' "$rescue_c"
          grep -q 'static_assert(E2631_RESCUE_MTD0_END == CONFIG_ENV_OFFSET' "$rescue_c"
          grep -q 'static_assert(E2631_RESCUE_FLASH_LEN == E2631_RESCUE_IMG_LEN' "$rescue_c"
          grep -q 'e2631_flash_begin(E2631_RESCUE_FLASH_OFF,' "$rescue_c"
          grep -q 'E2631_RESCUE_FLASH_LEN, img);' "$rescue_c"
          grep -q 'e2631_flash_write_image(rescue_image());' "$rescue_c"
          grep -q 'e2631_flash_compare(rescue_image(),' "$rescue_c"
          if grep -q 'img + E2631_RESCUE_FLASH_OFF' "$rescue_c"; then
            echo "::error::the rescue write source must be the image base, not img + 0x20000"
            exit 1
          fi
          if grep -q 'rescue_image() +' "$rescue_c"; then
            echo "::error::the rescue write/compare source must be rescue_image(), not a shifted pointer"
            exit 1
          fi
          echo "E4 rescue window gate: source is the image base, window 0x20000..0xC0000, one window for erase/write/compare"
          # task-77/U-0031: the environment read retries before it falls back, and
          # the final failure prints the diagnostic that identifies a bad read.
          env_c=env/mtd.c
          grep -q 'define ENV_MTD_READ_RETRIES[[:space:]]*3' "$env_c"
          grep -q 'static int env_mtd_read_block' "$env_c"
          grep -q 'static void env_mtd_dump_failure' "$env_c"
          grep -q 'env_mtd: stored crc 0x%08x, data crc 0x%08x' "$env_c"
          if ! grep -q 'for (attempt = 1; attempt <= ENV_MTD_READ_RETRIES; attempt++)' "$env_c"; then
            echo "::error::env_mtd_load() does not retry the read"
            exit 1
          fi
          echo "env retry gate: three read attempts and the failure diagnostic are present"
          # task-78/F2b: the TX probe and the bridge-block dump are the
          # diagnostic for the F2 hunt (frames complete but never leave).  The
          # default TX mode must stay the kernel descriptor, and the probe plus
          # the bridge-block helpers must be linked into the image.
          eth_c=drivers/net/zx279128s_eth.c
          grep -q 'static int zx_tx_mode = ZX_TX_MODE_PP;' "$eth_c"
          grep -q 'zx_tx_mode_names' "$eth_c"
          grep -q 'ZX_SBRG_EGRESS' drivers/net/zx279128s_eth.h
          for tx_text in 'e2631net: tx probe' 'switch fwd ctrl' 'dump the traffic manager, BMU and DMA registers'; do
            if ! grep -aq "$tx_text" build/u-boot.bin; then
              echo "::error::u-boot.bin is missing the F2 TX probe text: $tx_text"
              exit 1
            fi
          done
          echo "F2 TX probe gate: default mode pp, probe frames and bridge-block dump present"
          # F2 root cause (patch 0032): the switch forward control must carry
          # the value the kernel driver and the vendor bootloader write (17),
          # never BIT(17); the bmu dump is what proves the value on the board.
          if ! grep -q '#define ZX_SW_FWD_CTRL_ON[[:space:]]*17' drivers/net/zx279128s_eth.h; then
            echo "::error::the switch forward control is not 17 (F2 regression)"
            exit 1
          fi
          if grep -q '#define ZX_SW_FWD_CTRL_ON[[:space:]]*BIT' drivers/net/zx279128s_eth.h; then
            echo "::error::the switch forward control uses BIT(17) again (F2 regression)"
            exit 1
          fi
          grep -q 'zx_cmd_bmu' "$eth_c"
          grep -q 'e2631net: switch fwd ctrl 0x%08x (expected 0x%08x)' "$eth_c"
          if grep -aq 'SBRG egress before' build/u-boot.bin; then
            echo "::error::u-boot.bin still carries the old sbrg text"
            exit 1
          fi
          echo "F2 forward-control gate: value 17, the bmu dump and the new SBRG text are present"
          if ! grep -qx '# CONFIG_CMD_SAVEENV is not set' build/.config; then
            echo "::error::CONFIG_CMD_SAVEENV must stay disabled (A3 is read-only)"
            exit 1
          fi
          # U-0017: the environment is written only by the explicit e2631env
          # command; the generic saveenv/eraseenv writers stay compiled out and
          # the block is not redundant. The five-step writer must keep its
          # bad-block precheck above the erase and the layout must stay frozen.
          if grep -qx 'CONFIG_CMD_ERASEENV=y' build/.config; then
            echo "::error::CONFIG_CMD_ERASEENV must stay disabled"
            exit 1
          fi
          if grep -qx 'CONFIG_SYS_REDUNDAND_ENVIRONMENT=y' build/.config; then
            echo "::error::the env block must not become redundant"
            exit 1
          fi
          if ! grep -q 'e2631_env_snapshot' board/zte/zxhn-e2631/e2631boot.c; then
            echo "::error::board_late_init must snapshot the vendor env keys"
            exit 1
          fi
          if ! grep -q 'e2631_env_write_block' board/zte/zxhn-e2631/e2631env.c; then
            echo "::error::the e2631env five-step writer is missing"
            exit 1
          fi
          bad_line=$(grep -n 'mtd_block_isbad' board/zte/zxhn-e2631/e2631env.c | head -1 | cut -d: -f1)
          erase_line=$(grep -n 'mtd_erase' board/zte/zxhn-e2631/e2631env.c | head -1 | cut -d: -f1)
          if [ -z "$bad_line" ] || [ -z "$erase_line" ] || [ "$bad_line" -ge "$erase_line" ]; then
            echo "::error::the e2631env bad-block precheck must stay above the erase"
            exit 1
          fi
          env_asserts=$(grep -c 'static_assert(' board/zte/zxhn-e2631/e2631env.c)
          if [ "$env_asserts" != "4" ]; then
            echo "::error::the env layout needs four compile-time asserts, found $env_asserts"
            exit 1
          fi
          if grep -l '0[eE]0000' board/zte/zxhn-e2631/*.c | grep -v 'e2631env.c$'; then
            echo "::error::the reserved 0xE0000 sector must be handled by e2631env.c only"
            exit 1
          fi
          for env_usage in \
            'inspect and persist the vendor-compatible environment block' \
            'DO NOT POWER OFF'; do
            if ! grep -aq "$env_usage" build/u-boot.bin; then
              echo "::error::u-boot.bin is missing the env text: $env_usage"
              exit 1
            fi
          done
          if grep -qx 'CONFIG_ENV_IS_NOWHERE=y' build/.config; then
            echo "::error::ENV_IS_NOWHERE must not be set when ENV_IS_IN_MTD is"
            exit 1
          fi
          # A3/C1a (task-53): bootm needs a valid ATAGS buffer, and the env
          # location name must stay visible in the log. These are shape gates;
          # the runtime proof is the C1a RAM-chain re-run (evidence doc 11.3).
          if ! grep -q 'bi_boot_params' board/zte/zxhn-e2631/e2631boot.c; then
            echo "::error::the board must set gd->bd->bi_boot_params before bootm"
            exit 1
          fi
          if ! grep -q 'define ENV_NAME(_name) .name = _name,' include/env_internal.h; then
            echo "::error::the env location name is hidden again (ENV_NAME guard)"
            exit 1
          fi
          # C1b-1: the flash chain must run the vendor-order CP15 cleanup before
          # the kernel jump, and the entry normalisation must be enabled again.
          if ! grep -q 'e2631_soc_prepare_linux' board/zte/zxhn-e2631/e2631boot.c; then
            echo "::error::e2631boot does not run the CP15 cleanup before bootm"
            exit 1
          fi
          if ! grep -q 'mcr p15' board/zte/zxhn-e2631/e2631soc.c; then
            echo "::error::the CP15 cleanup is not implemented in e2631soc.c"
            exit 1
          fi
          # A5: the flash chain must run the vendor board_eth_init() clock/SerDes
          # sequence before bootm, and the exact vendor values must stay in the
          # table (a silent kernel network regression is otherwise easy to miss).
          if ! grep -q 'e2631_net_refclk_init' board/zte/zxhn-e2631/e2631boot.c; then
            echo "::error::e2631boot does not run the network reference-clock init before bootm"
            exit 1
          fi
          for net_marker in 0x004fdf3b 0x003c0040 0x0001381b 0x0f3ffffa 0x003dbf85 0x00100000; do
            if ! grep -qi "$net_marker" board/zte/zxhn-e2631/e2631net.c; then
              echo "::error::e2631net.c is missing the vendor value $net_marker"
              exit 1
            fi
          done
          # A6: zte_gpio_init() drives two more table entries high after the
          # replay (pins 2 and 51); without them the PCIe endpoints stay down.
          if ! grep -q "E2631_GPIO_PCIE_RST0" board/zte/zxhn-e2631/e2631net.c; then
            echo "::error::the late PCIe reset-line drives are missing from e2631net.c"
            exit 1
          fi
          # E4 (task-76): the vendor TOPCRM soft reset is the only reset path on
          # this board; keep the 50 ms delay and the single register write.
          if ! grep -q 'ZX279128S_TOPCRM_SOFT_RST' board/zte/zxhn-e2631/zxhn-e2631.c; then
            echo "::error::the TOPCRM reset register define is missing"
            exit 1
          fi
          if ! grep -q 'mdelay(50)' board/zte/zxhn-e2631/zxhn-e2631.c; then
            echo "::error::the vendor reset delay is missing"
            exit 1
          fi
          # U-0016: the class-1 cross-slot fallback must stay in the source and
          # in the linked image. cspboot boots the other slot when the selected
          # slot uImage is unusable; the log string is the runtime proof that
          # the retry path survived compilation and the --gc-sections link.
          if ! grep -q "e2631_try_boot_slot" board/zte/zxhn-e2631/e2631boot.c; then
            echo "::error::e2631_try_boot_slot() is missing from e2631boot.c"
            exit 1
          fi
          for fb_marker in "falling back to slot" "cspboot class-1 parity"; do
            if ! grep -q "$fb_marker" board/zte/zxhn-e2631/e2631boot.c; then
              echo "::error::the class-1 fallback log line is missing: $fb_marker"
              exit 1
            fi
          done
          if ! grep -aq "falling back to slot" build/u-boot.bin; then
            echo "::error::u-boot.bin is missing the class-1 fallback log string"
            exit 1
          fi
          echo "class-1 slot fallback: source and image present"
          # E2: the Ethernet driver needs the board clock/SerDes hook (the
          # driver calls it from start(), so a boot path that skips it still
          # gets the PHYs), and the arena guard belongs to e2631flash. The
          # device-tree nodes are the only source of the register addresses.
          if ! grep -q 'e2631_net_refclk_init' drivers/net/zx279128s_eth.c; then
            echo "::error::the Ethernet driver does not run the board clock/SerDes hook"
            exit 1
          fi
          if ! grep -q 'refclk_done' board/zte/zxhn-e2631/e2631net.c; then
            echo "::error::e2631_net_refclk_init() is not idempotent (driver and boot path both call it)"
            exit 1
          fi
          if ! grep -q 'E2631_NET_ARENA_ADDR' board/zte/zxhn-e2631/e2631flash.c; then
            echo "::error::e2631flash does not know the network DMA arena"
            exit 1
          fi
          if ! grep -q 'e2631_check_ram_range("e2631verify"' board/zte/zxhn-e2631/e2631flash.c; then
            echo "::error::e2631verify does not use the arena guard"
            exit 1
          fi
          if ! grep -q '0x45000000UL' board/zte/zxhn-e2631/e2631flash.c drivers/net/zx279128s_eth.c; then
            echo "::error::the 16 MiB DMA arena base is not pinned in both files"
            exit 1
          fi
          if ! grep -q 'zte,switch-port' arch/arm/dts/zx279128s-zte-zxhn-e2631.dts; then
            echo "::error::the Ethernet node lost its zte,switch-port property"
            exit 1
          fi
          if ! grep -aq 'lan1 up' build/u-boot.bin; then
            echo "::error::u-boot.bin is missing the Ethernet bring-up log string"
            exit 1
          fi
          echo "E2 Ethernet: driver, arena guard and device tree present"
          # F2-a fix (task-69 item 1): the send path must never fail silently
          # and a timed-out BMU request must stay pending for the next call.
          if ! grep -q 'bmu_alloc_pending' drivers/net/zx279128s_eth.c; then
            echo "::error::the BMU pending-retry state is missing from the Ethernet driver"
            exit 1
          fi
          if ! grep -q '1 buffer required' drivers/net/zx279128s_eth.c; then
            echo "::error::the Ethernet send path does not report the required buffer count"
            exit 1
          fi
          if ! grep -aq 'TX buffer allocation failed' build/u-boot.bin; then
            echo "::error::u-boot.bin is missing the honest TX-failure log string"
            exit 1
          fi
          # Item 2: the staging / kernel-copy / arena geometry is asserted at
          # compile time, so a later address change cannot silently make a
          # staged image overlap the traffic manager arena.
          for shape_marker in \
            'the network DMA arena must start above the uImage staging address' \
            'the uImage staging area must start above the kernel copy window' \
            'at least 48 MiB of uImage staging must fit below the network DMA arena'; do
            if ! grep -rqs "$shape_marker" drivers/net board/zte/zxhn-e2631; then
              echo "::error::missing geometry assertion: $shape_marker"
              exit 1
            fi
          done
          echo "E2 fix: BMU pending retry, honest TX error and geometry asserts present"
          # Multifunction U-Boot space budget: the mtd0 payload window is
          # 0x20800..0xBFFFF (0x9F800 = 653312 bytes). Keep an 8 KiB safety
          # margin for the next patches, so the build fails above 645120 bytes
          # BEFORE the mtd0 image is assembled (this gate lives upstream of
          # "Package the flashable mtd0 image").
          size=$(stat -c%s build/u-boot.bin)
          max=$((E2631_UBOOT_PAYLOAD_MAX))
          margin=8192
          gate=$((max - margin))
          headroom=$((max - size))
          echo "u-boot.bin: $size bytes, hard cap $max bytes, CI gate $gate bytes ($margin byte safety margin), headroom $headroom bytes"
          if [ "$size" -gt "$gate" ]; then
            echo "::error::u-boot.bin is $size bytes, above the CI gate $gate bytes (hard cap $max bytes, $margin byte safety margin); observed $size, limit $gate"
            exit 1
          fi
          # readelf prints the entry point in lowercase hex; the pin is uppercase.
          entry=$(readelf -h build/u-boot | sed -n 's/.*Entry point address:[[:space:]]*//p' | tr 'A-F' 'a-f')
          expected_entry=$(printf '%s' "$E2631_UBOOT_TEXT_BASE" | tr 'A-F' 'a-f')
          if [ "$entry" != "$expected_entry" ]; then
            echo "::error::ELF entry point $entry != $E2631_UBOOT_TEXT_BASE"
            exit 1
          fi
          echo "entry point: $entry"
      - name: Assert the unused EFI/MMC/FAT/standard-boot stack stays compiled out
        # task-69 defconfig drop: CONFIG_MMC=n also clears BLK, and BLK is what
        # brought back EFI_LOADER (default y on armv7) and BOOTSTD (default y if
        # BLK); FS_FAT/FAT_WRITE followed from EFI_LOADER. Assert the symptom
        # (the EFI/MMC/FAT/BOOTSTD/block stack is gone) and the command set we
        # must keep, so re-enabling BLK later fails here instead of silently
        # charging the payload budget for a subsystem this board cannot use.
        run: |
          set -euo pipefail
          cd "$UBOOT_DIR"
          grep -qx '# CONFIG_MMC is not set' configs/zx279128s_zte_zxhn-e2631_defconfig
          for notset in '# CONFIG_MMC is not set' '# CONFIG_FS_FAT is not set' '# CONFIG_BOOTSTD is not set' '# CONFIG_CMD_PXE is not set'; do
            grep -qx "$notset" build/.config || {
              echo "::error::build/.config is missing $notset"
              exit 1
            }
          done
          for gone in CONFIG_EFI_LOADER CONFIG_EFI CONFIG_BLK CONFIG_FAT_WRITE CONFIG_CMD_BOOTEFI CONFIG_CMD_BOOTFLOW CONFIG_CMD_EFICONFIG CONFIG_CMD_BLOCK_CACHE; do
            if grep -qx "$gone=y" build/.config; then
              echo "::error::build/.config still enables $gone"
              exit 1
            fi
          done
          for kept in CONFIG_CMD_BOOTM=y CONFIG_CMD_MTD=y CONFIG_CMD_DHCP=y CONFIG_CMD_TFTPBOOT=y CONFIG_CMD_MII=y CONFIG_CMD_PING=y CONFIG_OF_LIBFDT=y CONFIG_LMB=y; do
            grep -qx "$kept" build/.config || {
              echo "::error::build/.config lost $kept"
              exit 1
            }
          done
          echo "slim config: no EFI/MMC/FAT/standard-boot symbols; bootm, MTD and the net commands kept"
      - name: Assert e2631flash and e2631env are the only MTD writers (D-U1)
        # CMD_MTD_WRITE=n compiles the raw mtd write/erase subcommands out; the
        # call-site allowlist then proves every mtd_write()/mtd_erase() call in
        # the linked image sits inside one of the two safe writers (e2631flash
        # helpers or the e2631env five-step writer) and requires exactly the
        # expected number of sites so the gate cannot pass vacuously.
        run: |
          set -euo pipefail
          cd "$UBOOT_DIR"
          grep -qx '# CONFIG_CMD_MTD_WRITE is not set' build/.config
          grep -qx '# CONFIG_CMD_MTD_WRITE is not set' configs/zx279128s_zte_zxhn-e2631_defconfig
          sites=$(arm-none-eabi-objdump -d build/u-boot | awk '
            /^[0-9a-f]+ <[^>]+>:/ {
              fn = $2
              gsub(/[<>:]/, "", fn)
              next
            }
            /<mtd_write>|<mtd_erase>|<mtd_special_write_oob>/ {
              print fn "|" $0
            }')
          if [ -z "$sites" ]; then
            echo "::error::no mtd_write/mtd_erase call site found (vacuous gate)"
            exit 1
          fi
          echo "$sites"
          bad=$(echo "$sites" | awk -F'|' '
            $1 !~ /^(e2631_write_range|e2631_erase_range|do_e2631flash|e2631_env_write_block|do_e2631env_save)$/ {
              print
            }')
          if [ -n "$bad" ]; then
            echo "::error::mtd write/erase call outside e2631flash:"
            echo "$bad"
            exit 1
          fi
          writers=$(echo "$sites" | grep -cE '<mtd_write>|<mtd_erase>' || true)
          if [ "$writers" != "4" ]; then
            echo "::error::expected 4 mtd_write/mtd_erase sites (2 e2631flash helpers + 2 e2631_env_write_block), found $writers"
            exit 1
          fi
          if ! echo "$sites" | grep -qE 'e2631_env_write_block|do_e2631env_save'; then
            echo "::error::no MTD writer site was found inside the e2631env writer"
            exit 1
          fi
          echo "mtd writer sites: $writers (e2631flash and the e2631env writer; -O2 inlines the static helpers)"
          # The refusals that make that single writer safe must stay in the
          # source: the protected secondboot/environment areas, the alignment
          # and chip-bounds check, and the power-off banner printed before the
          # first erase. Regressing any of them is a gate failure, not a doc nit.
          for marker in \
            'E2631_ENV_OFF' \
            'E2631_BOOTLOADER_OFF' \
            'e2631_flash_check' \
            'DO NOT POWER OFF' \
            'overlaps secondboot' \
            'overlaps the environment'; do
            if ! grep -q "$marker" board/zte/zxhn-e2631/e2631flash.c; then
              echo "::error::e2631flash.c lost its safety marker: $marker"
              exit 1
            fi
          done
          echo "e2631flash safety guards: present"
          # The env writer must keep the same guard order and the whitelist /
          # snapshot machinery; these are source markers, the allowlist above
          # already proves that no other code path can call the MTD writers.
          for env_marker in \
            'DO NOT POWER OFF DURING WRITE' \
            'mtd_block_isbad' \
            'e2631_env_vendor_names' \
            'nothing to write'; do
            if ! grep -q "$env_marker" board/zte/zxhn-e2631/e2631env.c; then
              echo "::error::e2631env.c lost its safety marker: $env_marker"
              exit 1
            fi
          done
          echo "e2631env safety guards: present"
      - name: Run checkpatch on the port series (0 errors / 0 warnings required)
        if: inputs.checkpatch
        run: |
          # Exactly four reviewed warning classes are ignored, and the ignore
          # list itself is pinned below; any other warning class and every
          # error fails this step, so a new warning cannot slip in silently.
          #
          # FILE_PATH_CHANGES: checkpatch clears $reported_maintainer_file for
          # every patch (checkpatch.pl:2805; the new-file check at 3560-3568 is
          # gated on it), so the trailing MAINTAINERS patch 0021 cannot silence
          # the new-file reminders of the earlier patches, which are expected.
          # CMD_TEST: matches only added lines shaped do_<name>(struct cmd_tbl
          # (checkpatch.pl:2670-2674) and ignores documentation; the eight
          # e2631* commands are board-local and U-Boot has no DM test for them.
          # LIVETREE: false positives on the board-level fdtdec_setup_mem_size_base()
          # and fdtdec_setup_memory_banksize() calls in the frozen port patch 0002.
          # PREFER_IF: the deliberate compile-time #if CONFIG_IS_ENABLED(CMD_MTD_WRITE)
          # gate in patch 0015; a runtime if would not compile the raw mtd write
          # path out, so this one is structural.
          set -uo pipefail
          cd "$UBOOT_DIR"
          ignores="FILE_PATH_CHANGES,CMD_TEST,LIVETREE,PREFER_IF"
          expected=$(printf '%s\n' FILE_PATH_CHANGES CMD_TEST LIVETREE PREFER_IF | sort | tr '\n' ' ' | sed 's/ $//')
          got=$(printf '%s' "$ignores" | tr ',' '\n' | sort | tr '\n' ' ' | sed 's/ $//')
          if [ "$got" != "$expected" ]; then
            echo "::error::checkpatch ignore list is not exactly the four reviewed classes"
            exit 1
          fi
          out_dir="$RUNNER_TEMP/port-patches"
          mkdir -p "$out_dir"
          git -c user.name='E2631 CI' -c user.email='ci@localhost' \
            format-patch -q -o "$out_dir" "$E2631_UBOOT_SHA"..HEAD
          out=$(scripts/checkpatch.pl --no-tree --terse --ignore "$ignores" "$out_dir"/*.patch 2>&1) || true
          printf '%s\n' "$out" > "$UBOOT_DIR/build/checkpatch.txt"
          printf '%s\n' "$out" | tail -20
          errors=$(printf '%s\n' "$out" | grep -c ': ERROR:' || true)
          warnings=$(printf '%s\n' "$out" | grep -c ': WARNING:' || true)
          echo "checkpatch: errors=$errors warnings=$warnings (four reviewed classes ignored; any other warning or error fails the build)"
          if [ "$errors" -gt 0 ] || [ "$warnings" -gt 0 ]; then
            echo "::error::checkpatch reported $errors error(s) and $warnings non-exempt warning(s); inspect the artifact"
            exit 1
          fi
      - name: Package the flashable mtd0 image
        # The P0 tools (task-41) turn the freshly built payload into the mtd0
        # 0x20000..0xC0000 image area: the 0x800-byte header block is copied from
        # the vendor image and only +0x14 (payload length) changes; the payload
        # follows at 0x20800; the env area starts at 0xC0000 and is NOT written.
        # The vendor header block comes from the tracked extraction in
        # evidence/p2-oob/, and the vendor env block is rebuilt byte-identically
        # from the tracked live-env text (P0 round-trip evidence). Produce only:
        # nothing here touches a device.
        run: |
          set -euo pipefail
          cd "$UBOOT_DIR"
          work="$RUNNER_TEMP/mtd0"
          mkdir -p "$work" artifacts
          node - "$GITHUB_WORKSPACE/evidence/p2-oob/headblock-0x20000-0x20800.hex" \
                 "$work/uboot-header.bin" <<'NODE'
          const fs = require('node:fs');
          const [hexPath, outPath] = process.argv.slice(2);
          const tokens = fs.readFileSync(hexPath, 'utf8').trim().split(/\s+/);
          const header = Buffer.from(tokens.map((t) => parseInt(t, 16)));
          if (header.length !== 0x800) throw new Error('vendor U-Boot header block is ' + header.length + ' bytes, expected 0x800');
          if (header.subarray(0x10, 0x14).toString('latin1') !== '128s') throw new Error('vendor header block lost its 128s magic');
          fs.writeFileSync(outPath, header);
          console.log('vendor U-Boot header block: 0x' + header.length.toString(16) + ' bytes');
          NODE
          node "$GITHUB_WORKSPACE/tools/e2631-env.mjs" build \
            --in "$GITHUB_WORKSPACE/evidence/b1-env-current-20261121.txt" \
            --out "$work/e2631-env-block.bin"
          node - "$work/uboot-header.bin" "$work/e2631-env-block.bin" "$work/mtd0-template.bin" <<'NODE'
          const fs = require('node:fs');
          const [headerPath, envPath, outPath] = process.argv.slice(2);
          const header = fs.readFileSync(headerPath);
          const env = fs.readFileSync(envPath);
          if (header.length !== 0x800) throw new Error('header block size');
          if (env.length !== 0x20000) throw new Error('env block is ' + env.length + ' bytes, expected 0x20000');
          const template = Buffer.alloc(0x100000, 0xFF);
          header.copy(template, 0x20000);
          env.copy(template, 0xC0000);
          fs.writeFileSync(outPath, template);
          console.log('mtd0 template: vendor header @0x20000, vendor env @0xC0000');
          NODE
          node "$GITHUB_WORKSPACE/tools/mkuboot-image.mjs" build \
            --dump "$work/mtd0-template.bin" --payload build/u-boot.bin \
            --out artifacts/e2631-uboot-mtd0.bin --full-mtd0 "$work/mtd0-full.bin" --json
          cp "$work/e2631-env-block.bin" artifacts/e2631-env-block.bin
      - name: Verify the mtd0 image against the P0 gates
        # task-41's offline gates, now applied to the CI-built image: unpack/build
        # round-trip, env CRC32 round-trip, and the verify-mtd0 sha256 read-back
        # gate, plus the structural bounds (0xA0000 area, vendor header verbatim,
        # payload byte-identical to u-boot.bin, everything after it erased, env
        # block starting at 0xC0000 untouched).
        run: |
          set -euo pipefail
          cd "$UBOOT_DIR"
          work="$RUNNER_TEMP/mtd0"
          node "$GITHUB_WORKSPACE/tools/mkuboot-image.mjs" check --dump "$work/mtd0-full.bin"
          node "$GITHUB_WORKSPACE/tools/e2631-env.mjs" check --dump "$work/mtd0-full.bin"
          mtd0_sha=$(sha256sum artifacts/e2631-uboot-mtd0.bin | awk '{print $1}')
          node "$GITHUB_WORKSPACE/tools/verify-mtd0.mjs" --file artifacts/e2631-uboot-mtd0.bin --sha256 "$mtd0_sha"
          node - "$GITHUB_WORKSPACE/evidence/p2-oob/headblock-0x20000-0x20800.hex" \
                 artifacts/e2631-uboot-mtd0.bin build/u-boot.bin <<'NODE'
          const fs = require('node:fs');
          const [hexPath, imagePath, payloadPath] = process.argv.slice(2);
          const tokens = fs.readFileSync(hexPath, 'utf8').trim().split(/\s+/);
          const vendorHeader = Buffer.from(tokens.map((t) => parseInt(t, 16)));
          const image = fs.readFileSync(imagePath);
          const payload = fs.readFileSync(payloadPath);
          const payloadEnd = 0x800 + payload.length;
          if (image.length !== 0xA0000) throw new Error('mtd0 image is ' + image.length + ' bytes, expected 0xa0000');
          for (let i = 0; i < 0x800; i++) {
            if (i >= 0x14 && i < 0x18) continue; // +0x14 is the payload length, rewritten on purpose
            if (image[i] !== vendorHeader[i]) throw new Error('mtd0 image header block differs from the vendor block at +0x' + i.toString(16));
          }
          if (image.readUInt32LE(0x14) !== payload.length) throw new Error('header length field ' + image.readUInt32LE(0x14) + ' != u-boot.bin ' + payload.length);
          if (!image.subarray(0x800, payloadEnd).equals(payload)) throw new Error('mtd0 payload is not byte-identical to u-boot.bin');
          if (!image.subarray(payloadEnd).every((b) => b === 0xFF)) throw new Error('mtd0 image has non-erased bytes after the payload');
          if (payloadEnd > 0xA0000) throw new Error('payload end 0x' + payloadEnd.toString(16) + ' crosses the env at mtd0 0xC0000');
          console.log('mtd0 image: 0xa0000 bytes, vendor header + ' + payload.length + ' payload bytes (payload end 0x' + payloadEnd.toString(16) + '), erased tail, env @0xC0000 untouched');
          NODE
      - name: Report the per-object .text size table
        # The pinned U-Boot baseline has no 'make sizes' target (checked in the
        # pinned Makefile and upstream master), so this computes the same
        # authoritative per-object report from the build objects:
        # arm-none-eabi-size over every .o plus the linked-image total, sorted
        # by .text descending. UBOOT-SIZES.txt ships in the artifact and is
        # covered by SHA256SUMS; the E4 features (DHCP server, web UI) are
        # sized against this table, not against the map.
        run: |
          set -euo pipefail
          cd "$UBOOT_DIR"
          mkdir -p artifacts
          {
            echo "# E2631 U-Boot per-object .text sizes"
            echo "# tree $E2631_UBOOT_TREE_SHA; toolchain $(arm-none-eabi-gcc --version | head -1)"
            echo "# columns: text data bss filename (arm-none-eabi-size, sorted by text desc)"
            echo "# linked image total:"
            arm-none-eabi-size build/u-boot | sed 's/^/# /'
            echo "# objects:"
            find build -type f -name '*.o' -print0 \
              | xargs -0 -r arm-none-eabi-size 2>/dev/null \
              | awk '$1 ~ /^[0-9]+$/ { printf "%8d %8d %8d %s\n", $1, $2, $3, $6 }' \
              | sort -k1,1nr -k4,4 || true
          } > artifacts/UBOOT-SIZES.txt
          test -s artifacts/UBOOT-SIZES.txt || {
            echo "::error::UBOOT-SIZES.txt is empty"
            exit 1
          }
          rows=$(grep -c '^ *[0-9]' artifacts/UBOOT-SIZES.txt || true)
          if [ "$rows" -lt 100 ]; then
            echo "::error::UBOOT-SIZES.txt has only $rows object rows (expected the full build)"
            exit 1
          fi
          echo "UBOOT-SIZES.txt: $rows object rows, sorted by .text"
          head -12 artifacts/UBOOT-SIZES.txt
      - name: Stage the artifact and record provenance
        run: |
          set -euo pipefail
          cd "$UBOOT_DIR"
          size=$(stat -c%s build/u-boot.bin)
          entry=$(readelf -h build/u-boot | sed -n 's/.*Entry point address:[[:space:]]*//p')
          mtd0_sha=$(sha256sum artifacts/e2631-uboot-mtd0.bin | awk '{print $1}')
          mtd0_size=$(stat -c%s artifacts/e2631-uboot-mtd0.bin)
          header_sha=$(sha256sum "$RUNNER_TEMP/mtd0/uboot-header.bin" | awk '{print $1}')
          # task-78: the assembled first 0x800 differs from the vendor template
          # (the +0x14 length field is rewritten), so report both, labelled.
          image_header_sha=$(head -c 2048 artifacts/e2631-uboot-mtd0.bin | sha256sum | awk '{print $1}')
          env_sha=$(sha256sum artifacts/e2631-env-block.bin | awk '{print $1}')
          payload_len=$(stat -c%s build/u-boot.bin)
          config_sha=$(sha256sum build/.config | awk '{print $1}')
          payload_max=$((E2631_UBOOT_PAYLOAD_MAX))
          gate=$((payload_max - 8192))
          headroom=$((payload_max - size))
          headroom_pct=$(awk -v h="$headroom" -v m="$payload_max" 'BEGIN { printf "%.2f", 100 * h / m }')
          gate_headroom=$((gate - size))
          mkdir -p artifacts
          cp build/u-boot.bin build/u-boot.map build/.config build/build.log artifacts/
          # E4 v1 (task-73): ship the generated rescue-page asset files too, so
          # the artifact proves what the build embedded (the .c/.h are generated,
          # never committed).
          cp board/zte/zxhn-e2631/e2631_failsafe_asset.c \
             board/zte/zxhn-e2631/e2631_failsafe_asset.h artifacts/
          cp build/checkpatch.txt artifacts/ 2>/dev/null || true
          patch_shas=$(env | grep '^E2631_UBOOT_PATCH_SHA256_[0-9][0-9][0-9][0-9]=' | sort | sed 's/^[^=]*=//' | tr '\n' ' ')
          # task-78: match the whole banner token, not a prefix such as
          # "U-Boot 20" that a partial embedded string can satisfy.
          banner=$(strings -a build/u-boot.bin | grep -m1 -E '^U-Boot [0-9]{4}\.[0-9]{2}-rc[0-9]+-g[0-9a-f]+ ' || true)
          if [ -z "$banner" ]; then
            echo "::error::u-boot.bin has no U-Boot banner string"
            exit 1
          fi
          crc32_of() {
            python3 -c 'import sys, zlib; print(format(zlib.crc32(open(sys.argv[1], "rb").read()) & 0xffffffff, "08x"))' "$1"
          }
          payload_sha=$(sha256sum build/u-boot.bin | awk '{print $1}')
          payload_crc=$(crc32_of build/u-boot.bin)
          mtd0_crc=$(crc32_of artifacts/e2631-uboot-mtd0.bin)
          # Static command-help dump: the ARM image cannot be executed on the
          # runner, so dump the U_BOOT_CMD blocks from the post-am source and
          # cross-check the command names against the binary strings.
          {
            echo "# E2631 U-Boot command help (static dump; the ARM image is not executed on the runner)"
            echo "# Source: board/zte/zxhn-e2631/*.c at post-am tree $E2631_UBOOT_TREE_SHA"
            echo
            for cmd in e2631flash e2631verify e2631slot e2631env e2631rescue; do
              echo "## $cmd"
              awk -v c="$cmd" '
                index($0, "U_BOOT_CMD(" c ",") { grab = 1 }
                grab { print }
                grab && /);[[:space:]]*$/ { exit }
              ' board/zte/zxhn-e2631/*.c
              if ! grep -aq "$cmd" build/u-boot.bin; then
                echo "::error::u-boot.bin is missing the $cmd command"
                exit 1
              fi
              echo
            done
            echo "## command names found in build/u-boot.bin"
            strings -a build/u-boot.bin | grep -aE 'e2631flash|e2631verify|e2631slot|e2631boot|e2631env|e2631rescue' | sed 's/^/  /'
          } > artifacts/E2631-COMMAND-HELP.txt
          test -s artifacts/E2631-COMMAND-HELP.txt || {
            echo "::error::E2631-COMMAND-HELP.txt is empty"
            exit 1
          }
          {
            echo "E2631 A1/A2/A3 custom U-Boot (slot boot, flash commands, env write-back)"
            echo "Repository: $E2631_UBOOT_REPO"
            echo "Branch: $E2631_UBOOT_BRANCH"
            echo "Baseline commit: $E2631_UBOOT_SHA"
            echo "Baseline tree: $E2631_UBOOT_BASE_TREE_SHA"
            echo "Port patches sha256: $patch_shas"
            echo "Post-am tree: $E2631_UBOOT_TREE_SHA"
            echo "Reproducible: git am --committer-date-is-author-date, SOURCE_DATE_EPOCH=$E2631_UBOOT_SOURCE_DATE_EPOCH"
            echo "Defconfig: zx279128s_zte_zxhn-e2631_defconfig"
            echo "Toolchain: $(arm-none-eabi-gcc --version | head -1)"
            echo "u-boot.bin size: $size bytes (limit $E2631_UBOOT_PAYLOAD_MAX = $((E2631_UBOOT_PAYLOAD_MAX)) bytes)"
            echo "Entry point: $entry"
            echo "Banner: $banner"
            echo "u-boot.bin crc32: $payload_crc"
            echo "u-boot.bin sha256: $payload_sha"
            echo "mtd0 image crc32: $mtd0_crc"
            echo "command help: E2631-COMMAND-HELP.txt (static U_BOOT_CMD dump + binary strings)"
            echo "mtd0 image: e2631-uboot-mtd0.bin, mtd0 0x20000..0xC0000 ($mtd0_size bytes), sha256 $mtd0_sha"
            echo "mtd0 image header (assembled, first 0x800 bytes): sha256 $image_header_sha"
            echo "mtd0 image header source: 0x800-byte vendor template block evidence/p2-oob/headblock-0x20000-0x20800.hex, template sha256 $header_sha (the +0x14 length field is rewritten)"
            echo "mtd0 payload length: $payload_len bytes (0x$(printf '%x' "$payload_len")); mtd0 image bounds 0x20000..0xC0000, env starts at 0xC0000"
            echo "vendor env block (read-only, not written by this image): e2631-env-block.bin, mtd0 0xC0000, 0x20000 bytes, sha256 $env_sha"
            echo "mtd0 image inputs: vendor header block evidence/p2-oob/headblock-0x20000-0x20800.hex, vendor env rebuild evidence/b1-env-current-20261121.txt"
            echo ""
            echo "payload footprint (mtd0 payload window 0x20800..0xBFFFF, hard cap $payload_max bytes):"
            echo "  u-boot.bin bytes: $size"
            echo "  mtd0 image bytes: $mtd0_size"
            echo "  hard cap bytes: $payload_max"
            echo "  CI gate bytes: $gate (hard cap - 8192 safety margin)"
            echo "  headroom bytes vs hard cap: $headroom"
            echo "  headroom percent vs hard cap: $headroom_pct%"
            echo "  headroom bytes vs CI gate: $gate_headroom"
            echo "  env block sha256: $env_sha"
            echo "  .config sha256: $config_sha"
            echo ""
            echo "failsafe rescue page (E4 v1, task-73):"
            sed 's/^/  /' artifacts/E2631-FAILSAFE-ASSET.txt
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Hardware tested: NO (A1/A2/A3 RAM-chain sessions are separate, user-approved steps)"
          } > artifacts/UBOOT-INFO.txt
          (cd artifacts && sha256sum u-boot.bin u-boot.map .config UBOOT-INFO.txt e2631-uboot-mtd0.bin e2631-env-block.bin E2631-COMMAND-HELP.txt UBOOT-SIZES.txt E2631-FAILSAFE-ASSET.txt e2631_failsafe_asset.c e2631_failsafe_asset.h > SHA256SUMS)
          cat artifacts/SHA256SUMS
          {
            echo "### E2631 A1/A2/A3 U-Boot build"
            echo ""
            echo "- pins: $E2631_UBOOT_REPO ($E2631_UBOOT_BRANCH @ $E2631_UBOOT_SHA)"
            echo "- post-am tree: $E2631_UBOOT_TREE_SHA"
            echo "- u-boot.bin: $size bytes (limit $((E2631_UBOOT_PAYLOAD_MAX)))"
            echo "- entry point: $entry"
            echo "- banner: $banner"
            echo "- crc32: u-boot.bin $payload_crc, mtd0 image $mtd0_crc"
            echo "- command help: E2631-COMMAND-HELP.txt (static dump of the new commands)"
            echo "- sizes: UBOOT-SIZES.txt (per-object .text, sorted descending; see the artifact)"
            echo "- failsafe page: E2631-FAILSAFE-ASSET.txt ($(grep '^gzip_bytes=' artifacts/E2631-FAILSAFE-ASSET.txt), served as a gzip asset; limit 6144 bytes)"
            echo "- mtd0 image: e2631-uboot-mtd0.bin ($mtd0_size bytes, 0x20000..0xC0000) sha256 $mtd0_sha"
            echo "- vendor env block: e2631-env-block.bin (0x20000 bytes, not written by the image) sha256 $env_sha"
            echo "- payload footprint: u-boot.bin $size / hard cap $payload_max bytes (headroom $headroom bytes, $headroom_pct%); CI gate $gate bytes; mtd0 image $mtd0_size bytes"
            echo "- env block sha256: $env_sha, .config sha256: $config_sha"
            echo "- note: no flash writes; A1/A2/A3 load it over tftp into RAM; the image asset is for the future, user-approved flash stage"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the A1/A2/A3 U-Boot artifact
        uses: actions/upload-artifact@v4
        with:
          name: e2631-uboot-${{ github.run_id }}
          path: ${{ runner.temp }}/u-boot/artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

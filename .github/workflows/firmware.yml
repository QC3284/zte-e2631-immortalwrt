name: Build experimental E2631 ImmortalWrt firmware
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create a GitHub pre-release for this build (official Release still needs user approval)'
        type: boolean
        default: false
      reproduce_v1100:
        description: 'Rebuild the released v1.10.0 byte-for-byte: writes tree topdir version/version.date and E2631_BUILD=20261114 (parity evidence P1/P4)'
        type: boolean
        default: false
      use_pinned_apk_key:
        description: 'Sign the package index with the pinned APK key from the E2631_APK_PRIVATE_KEY secret instead of a random per-build key (P8); the key is deleted from the runner before uploads'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: e2631-firmware-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      E2631_TREE: ${{ github.workspace }}/../openwrt
      E2631_OUT: ${{ github.workspace }}/../out
      # T-12: there is one kind of build now - a depth-1 checkout of the pinned
      # tree fork. The old E2631_BASE_KIND switch is retired.
      # P8: turn the optional pinned APK signing key into a value SOURCE-INFO can
      # record without ever printing the secret itself.
      E2631_USE_PINNED_APK_KEY: ${{ inputs.use_pinned_apk_key }}
      # Version stamped into the vendor header and shown by /etc/e2631-version
      # (user decision 2026-11-14). The stock web upgrade page only accepts the
      # vendor "V1.0.0.8B8.8000" shape, so these artifacts install via fwslot.
      E2631_VERSION: ImmortalWrt v1.10.0
      # Parity run (evidence/immortalwrt-verify-20261114.md P1/P4), default off.
      # When reproduce_v1100 is on: bootstrap writes the topdir version/version.date
      # of the released v1.10.0 and E2631_BUILD pins the packer build field, so a
      # rebuild can be compared byte-for-byte with the released image.
      E2631_REPRODUCE_V1100: ${{ inputs.reproduce_v1100 }}
      E2631_BUILD: ${{ inputs.reproduce_v1100 && '20261114' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.16.0'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl busybox libelf-dev xsltproc
      - name: Check source before building
        run: make check
      - name: Bootstrap the pinned tree fork
        run: make bootstrap
      - name: Install the pinned APK signing key (optional)
        # P8: a random ECDSA key every build is the default. With this input on,
        # the same pinned key signs the index, and SOURCE-INFO records its public
        # half so two runs can be shown to use the same key. The private key only
        # ever exists as a runner secret and a 0600 file in the build tree.
        if: inputs.use_pinned_apk_key
        env:
          E2631_APK_PRIVATE_KEY: ${{ secrets.E2631_APK_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$E2631_APK_PRIVATE_KEY" || {
            echo '::error::use_pinned_apk_key is on but the E2631_APK_PRIVATE_KEY secret is empty'
            exit 1
          }
          umask 077
          printf '%s\n' "$E2631_APK_PRIVATE_KEY" > "$E2631_TREE/private-key.pem"
          chmod 600 "$E2631_TREE/private-key.pem"
          echo 'pinned APK signing key installed in the build tree (0600)'
      - name: Check board references against the base tree
        run: make check
      - name: Build, package and verify firmware
        # P6: miniupnpd's gitrev.mk embeds GITHUB_REF_NAME + GITHUB_SHA under
        # Actions and the ref then leaks into the package content. Strip those
        # variables from THIS step's environment only; the rest of the job keeps
        # them so provenance stays honest.
        run: env -u GITHUB_REF_NAME -u GITHUB_SHA -u GITHUB_REF -u GITHUB_HEAD_REF -u GITHUB_BASE_REF make build
      - name: Assert DEVMEM survived into the kernel build config
        # Seed single-source: CONFIG_KERNEL_DEVMEM=y must reach the REAL kernel
        # config. include/kernel-defaults.mk appends every CONFIG_KERNEL_* line
        # at the end of the merged config (last-wins), so the target config
        # alone would be silently overridden - this asserts the image effect.
        run: |
          set -euo pipefail
          cfg=$(find "$E2631_TREE/build_dir" -maxdepth 4 -type f -name .config -path '*/linux-*/linux-*/*' | head -1)
          test -n "$cfg" || { echo '::error::no kernel build-dir .config found'; exit 1; }
          echo "kernel config: $cfg"
          grep -qx 'CONFIG_DEVMEM=y' "$cfg" || {
            echo '::error::CONFIG_DEVMEM=y missing from the kernel build config (seed not applied?)'
            exit 1
          }
          echo 'DEVMEM: present in the kernel build config'
      - name: Assert the build ref did not leak into miniupnpd (P6)
        run: |
          set -euo pipefail
          log=$(find "$E2631_OUT" -maxdepth 2 -type f -name world.log | head -1)
          test -n "$log" || { echo '::error::no world.log to check'; exit 1; }
          refs=$(grep -o -- '-DMINIUPNPD_GIT_REF=[^ ]*' "$log" || true)
          if [ -n "$refs" ]; then
            printf '%s\n' "$refs" | sort -u
            if printf '%s\n' "$refs" | grep -q -e "${GITHUB_REF_NAME:-}" -e "${GITHUB_SHA:0:8}"; then
              echo '::error::miniupnpd still embeds the build ref - the P6 normalization did not take effect'
              exit 1
            fi
          fi
          echo 'P6: no build ref in the miniupnpd gitref flags'
      - name: Remove the APK signing key from the runner
        if: always()
        run: rm -f "$E2631_TREE/private-key.pem"
      - name: Prepare experimental release
        id: release
        run: |
          set -euo pipefail
          mkdir -p release
          mapfile -t packages < <(find "$E2631_OUT" -maxdepth 1 -name 'e2631-immortalwrt-*.bin' -type f)
          test "${#packages[@]}" -eq 1
          cp "${packages[0]}" release/e2631-immortalwrt-experimental.bin
          # The pin names come from scripts/pins.env: source env.sh so SOURCE-INFO
          # records exactly the values the build asserted. The tree fork tip is a
          # branch commit whose SHA is stable; the base-port tree hash identifies
          # the reviewed sanechips port inside that history.
          . scripts/env.sh
          apk_key="random per build (no pinned input)"
          if [ "${E2631_USE_PINNED_APK_KEY:-false}" = true ] && [ -f "$E2631_TREE/public-key.pem" ]; then
            apk_key="pinned input, public key sha256 $(sha256sum "$E2631_TREE/public-key.pem" | cut -d' ' -f1)"
          elif [ -f "$E2631_TREE/public-key.pem" ]; then
            apk_key="random per build, public key sha256 $(sha256sum "$E2631_TREE/public-key.pem" | cut -d' ' -f1)"
          fi
          {
            echo "Kit commit: $GITHUB_SHA"
            echo "ImmortalWrt base: ${E2631_IW_REPO:-unknown} ${E2631_IW_BRANCH:-} @ ${E2631_IW_SHA:-unknown}"
            echo "ImmortalWrt tree (pristine): ${E2631_IW_TREE_SHA:-unknown}"
            echo "Port base tree (4 patches applied): ${E2631_BASE_TREE_SHA:-unknown}"
            echo "Tree fork: ${E2631_FORK_REPO:-unknown} ${E2631_FORK_BRANCH:-} @ ${E2631_FORK_SHA:-unknown}"
            echo "Parity reproduction: ${E2631_REPRODUCE_V1100:-false} (build stamp ${E2631_BUILD:-date-of-run})"
            echo "Kernel build id: e2631-build@immortalwrt-e2631 (P5, from the seed)"
            echo "Port patch 0001 sha256: ${E2631_BASE_PATCH_SHA256_0001:-unknown}"
            echo "Port patch 0002 sha256: ${E2631_BASE_PATCH_SHA256_0002:-unknown}"
            echo "Port patch 0003 sha256: ${E2631_BASE_PATCH_SHA256_0003:-unknown}"
            echo "Port patch 0004 sha256: ${E2631_BASE_PATCH_SHA256_0004:-unknown}"
            echo "Kernel: ${E2631_BASE_KERNEL:-unknown}"
            echo "APK signing key: $apk_key"
            # Feed provenance: T2 clones whatever the base tree's
            # feeds.conf.default names (immortalwrt feeds for this base), so
            # record both the remote and the commit - the URL is the proof the
            # build used ImmortalWrt feeds, not the OpenWrt ones.
            echo "Packages feed: $(git -C "$E2631_TREE/feeds/packages" remote get-url origin 2>/dev/null || echo unknown)"
            echo "Packages commit: $(git -C "$E2631_TREE/feeds/packages" rev-parse HEAD 2>/dev/null || echo unknown)"
            echo "LuCI feed: $(git -C "$E2631_TREE/feeds/luci" remote get-url origin 2>/dev/null || echo unknown)"
            echo "LuCI commit: $(git -C "$E2631_TREE/feeds/luci" rev-parse HEAD 2>/dev/null || echo unknown)"
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Hardware tested: NO"
          } > release/SOURCE-INFO.txt
          (cd release && sha256sum e2631-immortalwrt-experimental.bin SOURCE-INFO.txt > SHA256SUMS)
          echo "tag=e2631-exp-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: Publish only after all build and artifact gates pass
        # Dispatch defaults to a build-only run: no Release unless the caller
        # explicitly asks for one (T5/Lead). Official Releases stay user-gated.
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          E2631 ImmortalWrt 实验固件，仅适用于已核实硬件兼容性的 ZXHN E2631。

          通过本次源码检查、完整编译与产物校验；**尚未真机验证，不是稳定版**。
          基底为 ImmortalWrt，版本字符串 `ImmortalWrt v1.10.0`（非厂商 V 格式：厂商
          网页升级页只接受 V 开头的版本号，首次写入请用 fwslot 流程；之后可用
          `e2631-upgrade` 在线更新）。SOURCE-INFO.txt 记录 ImmortalWrt 基线与补丁哈希。
          已知问题：Wi-Fi 冷启动可能挂死（有自愈重试）；部分 SPI-NAND 批次不支持；
          首次进入应立即设置 root 密码（首启为开放设置网络）。
          下载 `.bin` 前核对设备型号、闪存批次及恢复途径，再按 SHA256SUMS 校验。
          NOTES
          gh release create "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "E2631 ImmortalWrt experimental ${RELEASE_TAG}" --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Stage build logs for archiving
        if: always()
        run: |
          mkdir -p build-logs
          if [ -d "$E2631_OUT" ]; then
            find "$E2631_OUT" -maxdepth 2 -type f -name world.log -exec cp '{}' build-logs/ \;
          fi
      - name: Retain build logs and release files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2631-build-${{ github.run_id }}
          path: |
            build-logs/
            release/
          if-no-files-found: ignore
          retention-days: 14
